const CROWD_URL='',CROWD_CAP=[600,500,400,200,500,250,800,300],CROWD_BASE=[.55,.5,.3,.2,.5,.25,.7,.3],crowd={list:[],measured:null};

const faceSvg=k=>`<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="${FACE[k].c}"/>${FACE[k].d}</svg>`;
$('#crowd-legend').innerHTML=['laugh','smile','cry'].map(k=>`<span class="face-icon">${faceSvg(k)}</span>${FACE[k].label}`).join('')+'<span>· 客流估算 · 非实地导航</span>';
const jitter=n=>{const v=Math.sin(n)*43758.5453;return v-Math.floor(v)};
function crowdModel(){const d=new Date(Date.now()+8*36e5),demo=!!wx.demo||!!window.qixia?.transit?.clock.demo,h=demo?11:d.getUTCHours()+d.getUTCMinutes()/60,dow=d.getUTCDay(),m=d.getUTCMonth()+1,open=h>=7&&h<17.5,

function crowdLine(){const el=$('#crowd-line');if(!el||!state.selected||!crowd.list.length)return;const i=places.findIndex(p=>p.id===state.selected),c=crowd.list[i],k=crowdLevel(c.load);let tip='';
 if(k==='cry'){const j=crowd.list.map((x,n)=>[x.load,n]).filter(([,n])=>n!==i).sort((a,b)=>a[0]-b[0])[0][1];tip=` · 想清静些，可先去「${places[j].name}」`}

/* ===== 精灵配音：预生成音频（assets/voices/*.m4a），同一时刻只播一段 ===== */
const VO=window.QIXIA_VOICES||null,voice=new Audio();voice.preload='auto';let speakToken=0,speakDone=null;
function speak(id){hush(false);const tok=++speakToken;voice.src=`assets/voices/${id}.m4a`;$('#detail .portrait')?.classList.add('speaking');
 return new Promise(res=>{speakDone=(ok=false)=>{voice.onended=voice.onerror=null;speakDone=null;$('#detail .portrait')?.classList.remove('speaking');res(ok&&tok===speakToken)};voice.onended=()=>speakDone?.(true);voice.onerror=()=>speakDone?.(false);voice.play().catch(()=>speakDone?.(false))})}

function shrink(file,max,q){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>{URL.revokeObjectURL(url);rej(Error('图片读取失败'))};im.src=url})}
async function lookAt(p,image){if(!location.protocol.startsWith('http'))return null;const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),10000);try{const r=await fetch('api/look',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({spot:p.name,persona:p.person,points:VO.spots[p.id].points,image}),signal:ac.signal});return r.ok?await r.json():null}catch(e){return null}finally{clearTimeout(tm)}}

 const filler=speak(`${p.id}-filler`),res=await lookAt(p,image);if(state.selected!==p.id)return;
 const point=res?res.point:0,clip=point?'p'+point:'intro',bubble=chat.querySelector('.bubble'),reply=res?res.reply:'我认出这里啦，先从头讲给你听。',tag=res?`看到：${res.see||'山中一景'} · ${(res.ms/1000).toFixed(1)} 秒`:'离线讲解 · 未连接识图服务';
 bubble.textContent='';const txt=document.createElement('span'),sm=document.createElement('small');bubble.append(txt,sm);let k=0;const typer=setInterval(()=>{txt.textContent=reply.slice(0,++k);if(k>=reply.length){clearInterval(typer);sm.textContent=tag}},reduced?0:35);

 await filler;if(state.selected!==p.id)return;const n=narrate(p,clip,point?`讲解 · ${VO.spots[p.id].points[point-1]}`:'讲解 · 初次见面');chat.appendChild(n.box);$('#panel').scrollTop=$('#panel').scrollHeight;n.play()};

/* 全景下将人物头像在屏幕空间轻微错开，保留每个景点的独立入口。 */
function relaxPins(){
 const vis=pins.filter(p=>!p.b.classList.contains('hidden')&&p.sc).map(p=>({p,x:parseFloat(p.b.style.left),y:parseFloat(p.b.style.top),ox:parseFloat(p.b.style.left),oy:parseFloat(p.b.style.top),r:20*p.sc}));
 pins.forEach(p=>{p.b.classList.remove('clustered','cluster');p.b.dataset.n='';p.lead=null});
 const w=app.offsetWidth,h=app.offsetHeight;
 for(let step=0;step<32;step++){
  for(let i=0;i<vis.length;i++)for(let j=i+1;j<vis.length;j++){
   const a=vis[i],b=vis[j];let dx=b.x-a.x,dy=(b.y-45*b.p.sc)-(a.y-45*a.p.sc),d=Math.hypot(dx,dy),min=a.r+b.r+4;
   if(d<min){if(d<.01){dx=1;dy=0;d=1}const push=(min-d)/2;dx/=d;dy/=d;a.x-=dx*push;a.y-=dy*push;b.x+=dx*push;b.y+=dy*push}
  }
  for(const v of vis){v.x=Math.max(v.r,Math.min(w-v.r,v.x));v.y=Math.max(65*v.p.sc,Math.min(h-4,v.y))}
 }
 vis.forEach(v=>{v.p.b.style.left=v.x+'px';v.p.b.style.top=v.y+'px'});
}
function zoomCluster(list){const c=list.reduce((v,q)=>v.add(new T.Vector3(...q.p.pos)),new T.Vector3()).multiplyScalar(1/list.length),span=Math.max(.6,...list.map(q=>Math.hypot(q.p.pos[0]-c.x,q.p.pos[2]-c.z)));const d=Math.max(5,span*7);goal={p:c.clone().add(new T.Vector3(.45*d,.75*d,.75*d)),t:c}}
/* 标签避让：地图上所有标签按重要程度排布，被更重要的挡住时淡出；拉近镜头后自然出现 */
function PRI(e){const c=e.classList;return c.contains('active')||c.contains('followed')?100:c.contains('spirit')?60:c.contains('rest-tag')?52:c.contains('stop')?(c.contains('home')?55:45):c.contains('gate-tag')?40:c.contains('lot-tag')?32:c.contains('bus-tag')?28:10}
function declutter(){declutter.n=(declutter.n||0)+1;if(declutter.n%3||!window.qixiaReady)return;const items=[];for(const e of $('#labels').children){if(e.classList.contains('hidden')||e.classList.contains('clustered'))continue;const r=(e.querySelector('.float,.disc')||e).getBoundingClientRect();if(r.width)items.push({e,r,p:PRI(e)})}items.sort((a,b)=>b.p-a.p);const kept=[];for(const o of items){const hit=!o.e.classList.contains('spirit')&&kept.some(k=>o.r.left<k.r.right+3&&o.r.right>k.r.left-3&&o.r.top<k.r.bottom+3&&o.r.bottom>k.r.top-3);o.e.classList.toggle('occluded',hit);if(!hit)kept.push(o)}}
