<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山中来信 · 本机审核</title><style>body{max-width:760px;margin:40px auto;padding:0 20px;font:15px/1.7 system-ui;color:#314b43;background:#f5f2ea}h1{font-weight:500}article{background:#fff;border-radius:10px;padding:20px;margin:16px 0}img{display:block;max-width:100%;max-height:420px;object-fit:contain;margin:12px 0}button{padding:10px 18px;margin-right:10px;border:0;border-radius:6px;background:#314b43;color:white}button.reject{background:#a65b4b}small{color:#7b8a7f}p{white-space:pre-wrap}</style><h1>山中来信 · 本机审核</h1><p>请核对文字和照片，确认适合公开且没有泄露隐私后，再选择审核结果。此页面仅供本机访问。</p><div id="list">正在加载…</div><script>
const names={lake:'明镜湖',stele:'明征君碑',palace:'行宫遗址',tea:'茶文化点',cave:'千佛岩石窟',stone:'青锋剑石',maple:'红叶谷',spring:'栖霞泉'};const list=document.querySelector('#list');async function load(){try{const r=await fetch('/api/review');if(!r.ok)throw Error('请在运行服务的电脑上通过 localhost 打开。');const {letters}=await r.json();list.replaceChildren();if(!letters.length){list.textContent='目前没有待审核的来信。';return}for(const x of letters){const card=document.createElement('article'),meta=document.createElement('small'),p=document.createElement('p');meta.textContent=`${names[x.spot]} · ${x.name} · ${new Date(x.createdAt).toLocaleString('zh-CN')}`;p.textContent=x.note;card.append(meta,p);if(x.photo){let img=new Image();img.src=x.photo;img.alt='待审核照片';card.append(img)}for(const [action,label] of [['approve','审核通过'],['reject','不予公开']]){const b=document.createElement('button');b.textContent=label;if(action==='reject')b.className='reject';b.onclick=async()=>{b.disabled=true;const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:x.id,decision:action})});if(r.ok)card.remove();else{alert('审核失败，请重试。');b.disabled=false}};card.append(b)}list.append(card)}}catch(e){list.textContent=e.message||'加载失败。'}}load();
</script></html>
